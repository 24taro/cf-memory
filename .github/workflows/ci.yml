name: CI
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      full:
        description: Run all tests and the Worker deployment dry-run
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:migrations
      - name: Authentication, data isolation, and installer tests
        if: github.event_name != 'workflow_dispatch' || !inputs.full
        run: >-
          npx vitest run test/security test/access.test.ts test/agent-door.test.ts
          test/owner-only-isolation.test.ts test/shared-memory.test.ts test/install.test.ts --maxWorkers=2
        env:
          CF_MEMORY_TEST_TIME_SCALE: '10'
      - name: Install script syntax and lint
        run: bash -n install.sh && shellcheck install.sh
      - name: Install script stops cleanly without a Cloudflare login
        timeout-minutes: 6
        run: |
          set +e
          out=$(./install.sh --no-client 2>&1); code=$?
          echo "$out" | tail -n 25
          test "$code" -ne 0 && echo "$out" | grep -q "not logged in to Cloudflare"
      - name: Full test prerequisites (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Full test suite (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: npm test -- --maxWorkers=2
        env:
          CF_MEMORY_TEST_TIME_SCALE: '10'
      - name: Worker dry-run (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: npm run build:check -- --outdir /tmp/cf-memory-dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
